services:
  # 1. AI Timetable Microservice (Node.js)
  - type: web
    name: english-timetable-ai-service
    env: node
    rootDir: ai_service
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5000

  # 2. PHP Web Frontend & Portal
  - type: web
    name: english-timetable-web
    env: php
    buildCommand: ""
    startCommand: apache2-foreground
